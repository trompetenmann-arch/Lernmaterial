<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mehr als ein Ganzes?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: Karopapier als Grund (dunkel: Schultafel), darauf eine Aufgabenkarte.
   Ablauf je Aufgabe: Term mit Zeichenwahl zwischen Summe und 1 -> Kreisanteile -> Stempel.
   Erster Bruch im Uhrzeigersinn, zweiter gegen den Uhrzeigersinn: Überlappung = mehr als 1, Lücke = weniger als 1. */
:root {
  --paper: #F3F6FA;
  --grid: #DCE5F0;
  --card: #FFFFFF;
  --ink: #1B2440;
  --ink-soft: #586382;
  --line: #CDD7E5;
  --a: #EF9415;
  --b: #3A6CDE;
  --good: #14804D;
  --good-soft: #DFF3E7;
  --bad: #C2334C;
  --bad-soft: #FBE3E7;
  --key: #1B2440;
  --key-fg: #FFFFFF;
  --key-edge: #070B1A;
  --focus: #3A6CDE;
  --hatch-bg: #F1F4F9;
  --hatch-line: #C9D3E2;
  --shadow: 0 18px 40px -24px rgba(27, 36, 64, .45);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, -apple-system, sans-serif;
  --pie: clamp(76px, 15vw, 160px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1B2926; --grid: #22332F; --card: #213230; --ink: #EDF2EC; --ink-soft: #A6B8B1;
    --line: #3A4E48; --a: #F5C352; --b: #82B8F5; --good: #7AD6A3; --good-soft: #1E3B2F;
    --bad: #F2909F; --bad-soft: #452930; --key: #EDF2EC; --key-fg: #1B2926; --key-edge: #8FA49C;
    --focus: #82B8F5; --hatch-bg: #2A3E39; --hatch-line: #557169;
    --shadow: 0 18px 40px -22px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1B2926; --grid: #22332F; --card: #213230; --ink: #EDF2EC; --ink-soft: #A6B8B1;
  --line: #3A4E48; --a: #F5C352; --b: #82B8F5; --good: #7AD6A3; --good-soft: #1E3B2F;
  --bad: #F2909F; --bad-soft: #452930; --key: #EDF2EC; --key-fg: #1B2926; --key-edge: #8FA49C;
  --focus: #82B8F5; --hatch-bg: #2A3E39; --hatch-line: #557169;
  --shadow: 0 18px 40px -22px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

[hidden] { display: none !important; }
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

.app { max-width: 1040px; margin: 0 auto; display: grid; gap: 18px; }

/* Kopfzeile */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-pie { width: 42px; height: 42px; flex: none; }
.brand-pie .pie-rim { stroke-width: 9; }
.brand-pie .pie-div { stroke-width: 7; }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(1.4rem, 2.8vw, 2rem);
  line-height: 1.1; letter-spacing: -.015em; margin: 0; text-wrap: balance;
}
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ghost {
  background: var(--card); border: 1.5px solid var(--line); border-radius: 999px;
  padding: 7px 14px; font-weight: 500; font-size: .9rem; cursor: pointer;
}
.ghost:hover { border-color: var(--ink-soft); }
.switch {
  display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: .9rem; font-weight: 500;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 14px 6px 8px;
}
.switch input {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none;
  width: 38px; height: 22px; border-radius: 999px; background: var(--line); position: relative; cursor: pointer;
  transition: background .2s;
}
.switch input::before {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--card); transition: transform .2s;
}
.switch input:checked { background: var(--b); }
.switch input:checked::before { transform: translateX(16px); }

/* Fortschritt */
.progress { display: flex; gap: 14px; }
.pg { display: grid; gap: 5px; min-width: 0; flex-basis: 0; }
.pg-label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.pg-row { display: flex; gap: 5px; }
.seg { flex: 1; height: 10px; border-radius: 5px; background: var(--line); transition: background .3s; }
.seg.now { background: var(--ink); }
.seg.good { background: var(--good); }
.seg.bad { background: var(--bad); }

/* Aufgabenkarte */
.board {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow);
  padding: clamp(16px, 4vw, 36px);
}
.task { display: grid; justify-items: center; gap: clamp(18px, 3vw, 28px); }

.expr {
  display: flex; align-items: center; justify-content: center; flex-wrap: nowrap;
  gap: clamp(10px, 2.6vw, 28px);
  font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 8.5vw, 5.4rem); line-height: 1;
  padding-block: 8px;
}
.bf { display: inline-flex; flex-direction: column; align-items: center; font-variant-numeric: tabular-nums; }
.bf .bbar { align-self: stretch; height: .1em; margin: .1em -.08em; border-radius: .05em; background: var(--ink); }
.bf.ca .bbar { background: var(--a); }
.bf.cb .bbar { background: var(--b); }
.plus { font-weight: 600; color: var(--ink-soft); }

/* Zeichenwahl direkt im Term */
.pickwrap { display: inline-flex; flex-direction: column; gap: .12em; }
.pick {
  font-family: var(--font-display); font-weight: 800; font-size: .6em; line-height: 1;
  width: 1.7em; height: 1.5em; display: grid; place-items: center; padding: 0 0 .06em;
  background: var(--key); color: var(--key-fg); border: 0; border-radius: .26em; cursor: pointer;
  box-shadow: 0 .09em 0 var(--key-edge);
  transition: transform .08s, box-shadow .08s;
}
.pick:hover { transform: translateY(-.02em); box-shadow: 0 .11em 0 var(--key-edge); }
.pick:active { transform: translateY(.07em); box-shadow: 0 .02em 0 var(--key-edge); }
.slot {
  display: inline-grid; place-items: center; width: 1.19em; height: 1.19em; font-size: .86em; padding-bottom: .05em;
  border: .05em solid var(--ink); border-radius: .22em; color: var(--ink); font-weight: 800;
  transition: background .25s, border-color .25s, color .25s;
}
.slot.good { border-color: var(--good); color: var(--good); background: var(--good-soft); }
.slot.bad { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); animation: shake .45s; }
@keyframes shake { 20%, 60% { transform: translateX(-.06em); } 40%, 80% { transform: translateX(.06em); } }

/* Kreisanteile */
.viz { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 10px clamp(6px, 1.6vw, 14px); }
.viz.enter { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.vgroup { display: flex; align-items: flex-start; gap: clamp(6px, 1.6vw, 14px); }
.pfig { margin: 0; display: grid; justify-items: center; gap: 6px; }
.pfig figcaption { color: var(--ink-soft); font-size: 1rem; min-height: 2.8em; display: flex; align-items: center; gap: 6px; }
.pfig figcaption .f { font-size: 1.3em; color: var(--ink); }
svg.pie { width: var(--pie); height: var(--pie); overflow: visible; display: block; }
.op {
  height: var(--pie); display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: clamp(1.5rem, 4vw, 2.4rem); color: var(--ink-soft);
}
.pie-base { fill: var(--card); }
.pie-faint { fill: none; stroke: var(--line); stroke-width: 2; }
.pie-gap { fill: url(#hatch); stroke: var(--ink-soft); stroke-width: 2; stroke-dasharray: 5 4; opacity: 0; transition: opacity .45s; }
.pie-gap.on { opacity: 1; }
.fill-a { fill: var(--a); }
.fill-b { fill: var(--b); }
.pie-over { fill: url(#mix); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.pie-div { fill: none; stroke: var(--card); stroke-width: 3; }
.pie-rim { fill: none; stroke: var(--ink); stroke-width: 3.5; }
.hatch-bg { fill: var(--hatch-bg); }
.hatch-line { stroke: var(--hatch-line); stroke-width: 4; }
.mix-a { fill: var(--a); }
.mix-b { stroke: var(--b); stroke-width: 5; }
.result { font-weight: 600; color: var(--ink); }

/* Kleine Brüche */
.f {
  display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle;
  font-size: .84em; line-height: 1.08; font-weight: 600; margin: 0 .1em; font-variant-numeric: tabular-nums;
}
.f .n { border-bottom: 2px solid currentColor; padding: 0 .18em; }
.f .d { padding: 0 .18em; }
.f.ca .n { border-bottom: 3px solid var(--a); }
.f.cb .n { border-bottom: 3px solid var(--b); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Auflösung */
.verdict {
  width: 100%; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px 30px;
  border-radius: 18px; padding: 16px clamp(16px, 3vw, 28px);
}
.verdict.is-good { background: var(--good-soft); }
.verdict.is-bad { background: var(--bad-soft); }
.stamp {
  flex: none; font-family: var(--font-display); font-weight: 800; font-size: clamp(1.35rem, 3.4vw, 2rem);
  letter-spacing: .03em; text-transform: uppercase; line-height: 1; white-space: nowrap;
  padding: .38em .6em .32em; border: .12em solid currentColor; border-radius: .3em;
  outline: .05em solid currentColor; outline-offset: .12em;
  transform: rotate(-6deg); margin: 6px 4px;
  animation: stamp .38s cubic-bezier(.2, 1.4, .4, 1) both;
}
.is-good .stamp { color: var(--good); }
.is-bad .stamp { color: var(--bad); }
@keyframes stamp { from { opacity: 0; transform: rotate(-6deg) scale(1.9); } to { opacity: 1; transform: rotate(-6deg) scale(1); } }
.v-calc { margin: 0; font-size: clamp(1.1rem, 2.4vw, 1.35rem); line-height: 1.9; font-weight: 500; text-align: center; }

.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.go {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--key); color: var(--key-fg); border: 0; border-radius: 14px;
  padding: 13px 24px; font-weight: 600; font-size: 1.05rem; cursor: pointer;
  box-shadow: 0 4px 0 var(--key-edge); transition: transform .08s, box-shadow .08s;
}
.go:hover { transform: translateY(-1px); box-shadow: 0 5px 0 var(--key-edge); }
.go:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--key-edge); }
.go svg { width: 18px; height: 18px; }
.go.alt { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: 0 4px 0 var(--line); }

/* Auswertung */
.summary { display: grid; justify-items: center; gap: 18px; text-align: center; }
.summary .stamp { color: var(--b); font-size: clamp(1.5rem, 4vw, 2.2rem); }
.summary h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; margin: 0; letter-spacing: -.02em; }
.recap { list-style: none; margin: 4px 0 0; padding: 0; width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; text-align: left; }
.recap li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; border-radius: 12px; font-size: 1.1rem; }
.recap li.good { background: var(--good-soft); }
.recap li.bad { background: var(--bad-soft); }
.recap svg { width: 20px; height: 20px; flex: none; }
.recap li.good svg { color: var(--good); }
.recap li.bad svg { color: var(--bad); }

@media (max-width: 560px) {
  .progress { gap: 8px; }
  .pg-row { gap: 3px; }
  .switch span { font-size: .85rem; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="hatch-bg" width="9" height="9"></rect>
      <line class="hatch-line" x1="0" y1="0" x2="0" y2="9"></line>
    </pattern>
    <pattern id="mix" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect class="mix-a" width="10" height="10"></rect>
      <line class="mix-b" x1="0" y1="0" x2="0" y2="10"></line>
    </pattern>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="brand-pie" id="brandPie" aria-hidden="true"></svg>
      <h1>Mehr als ein Ganzes?</h1>
    </div>
    <div class="tools">
      <label class="switch" for="pauseToggle" title="Nach den Kreisbildern wartet die App auf „Auflösen“. Gut zum Besprechen.">
        <input type="checkbox" id="pauseToggle">
        <span>Pause vor Auflösung</span>
      </label>
      <button class="ghost" id="fsBtn" type="button" hidden>Vollbild</button>
      <button class="ghost" id="restartBtn" type="button">Neu starten</button>
    </div>
  </header>

  <nav class="progress" id="progress" aria-label="Fortschritt"></nav>

  <main class="board">
    <section class="task" id="taskView">
      <div class="expr" id="expr" role="group"></div>

      <div class="viz" id="viz" hidden>
        <div class="vgroup">
          <figure class="pfig"><svg class="pie" id="pieA" aria-hidden="true"></svg><figcaption id="capA"></figcaption></figure>
          <span class="op" aria-hidden="true">+</span>
          <figure class="pfig"><svg class="pie" id="pieB" aria-hidden="true"></svg><figcaption id="capB"></figcaption></figure>
        </div>
        <div class="vgroup">
          <span class="op" aria-hidden="true">=</span>
          <figure class="pfig"><svg class="pie" id="pieC" aria-hidden="true"></svg><figcaption class="result" id="capC" aria-live="polite"></figcaption></figure>
        </div>
      </div>

      <div class="verdict" id="verdict" aria-live="polite" hidden></div>

      <div class="actions" id="actions" hidden>
        <button class="go" id="revealBtn" type="button" hidden>Auflösen</button>
        <button class="go" id="nextBtn" type="button" hidden>
          <span id="nextLabel">Weiter</span>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5"></path></svg>
        </button>
      </div>
    </section>

    <section class="summary" id="summary" hidden></section>
  </main>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);

  /* ---------- Bruchrechnung ---------- */
  const gcd = (x, y) => { x = Math.abs(x); y = Math.abs(y); while (y) [x, y] = [y, x % y]; return x; };
  const lcm = (x, y) => (x / gcd(x, y)) * y;
  const red = (n, d) => { const g = gcd(n, d) || 1; return [n / g, d / g]; };

  const LEVEL_NAME = { 1: 'leicht', 2: 'mittel', 3: 'schwer' };

  // Startaufgaben: von "Vergleich mit 1/2 reicht" bis "ganz knapp an 1".
  const COURSE = [
    [2, 3, 1, 2, 1], [3, 5, 1, 4, 1], [1, 3, 2, 5, 1], [3, 4, 2, 3, 1],
    [4, 5, 1, 3, 2], [5, 6, 1, 4, 2], [5, 8, 1, 4, 2], [3, 10, 3, 5, 2],
    [3, 5, 3, 8, 3], [3, 8, 2, 3, 3], [5, 12, 3, 5, 3], [7, 10, 2, 7, 3],
  ].map(([a, b, c, d, level]) => ({ a, b, c, d, level }));

  function info(t) {
    const L = lcm(t.b, t.d);
    const an = t.a * (L / t.b), cn = t.c * (L / t.d), n = an + cn;
    return { L, an, cn, n, more: n > L };
  }

  const F = (n, d, cls = '') =>
    `<span class="f ${cls}"><span class="n">${n}</span><span class="sr">/</span><span class="d">${d}</span></span>`;
  const BigF = (n, d, cls) =>
    `<span class="bf ${cls}"><span>${n}</span><span class="bbar"></span><span class="sr">/</span><span>${d}</span></span>`;

  function calcHTML(t) {
    const { L, an, cn, n, more } = info(t);
    let s = `${F(t.a, t.b, 'ca')} + ${F(t.c, t.d, 'cb')}`;
    if (t.b !== t.d) s += ` = ${F(an, L)} + ${F(cn, L)}`;
    s += ` = ${F(n, L)}`;
    const [rn, rd] = red(n, L);
    if (rd !== L) s += ` = ${F(rn, rd)}`;
    return s + ` ${more ? '&gt;' : '&lt;'} 1`;
  }

  /* ---------- Zufallsaufgaben ---------- */
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (arr) => arr[rnd(arr.length)];
  function randFrac(dens) {
    for (;;) { const d = pick(dens), n = 1 + rnd(d - 1); if (gcd(n, d) === 1) return [n, d]; }
  }
  function genTask(level, used) {
    const dens = level === 3 ? [3, 4, 5, 6, 7, 8, 9, 10, 12] : [2, 3, 4, 5, 6, 8, 10, 12];
    for (let i = 0; i < 20000; i++) {
      const [a, b] = randFrac(dens), [c, d] = randFrac(dens);
      if (a * d === c * b) continue;
      const dist = Math.abs(a / b + c / d - 1);
      if (dist < 1e-9) continue;
      const hA = Math.sign(2 * a - b), hB = Math.sign(2 * c - d);
      const halfDecides = (hA >= 0 && hB >= 0) || (hA <= 0 && hB <= 0);
      const ok = level === 1 ? halfDecides && dist >= 1 / 6
        : level === 2 ? !halfDecides && dist >= 1 / 12 && dist <= 1 / 4
        : !halfDecides && dist < 1 / 12;
      const key = `${a}/${b}+${c}/${d}`;
      if (!ok || used.has(key)) continue;
      used.add(key);
      return { a, b, c, d, level };
    }
    return { ...COURSE[(level - 1) * 4] };
  }
  function randomRound() {
    const used = new Set(), out = [];
    for (const lv of [1, 2, 3]) for (let i = 0; i < 4; i++) out.push(genTask(lv, used));
    return out;
  }

  /* ---------- Kreisdiagramme ----------
     Positionen t in Umdrehungen ab 12 Uhr im Uhrzeigersinn (0 = oben, 1 = wieder oben).
     Der zweite Bruch belegt [1 - B, 1], wächst also von oben gegen den Uhrzeigersinn. */
  const R = 88;
  const fx = (v) => Math.round(v * 1000) / 1000;
  const pt = (t) => { const ang = t * 2 * Math.PI - Math.PI / 2; return [fx(R * Math.cos(ang)), fx(R * Math.sin(ang))]; };
  function sectorD(s, e) {
    const span = e - s;
    if (span <= 1e-6) return '';
    if (span >= 1 - 1e-6) return `M 0 ${-R} A ${R} ${R} 0 1 1 0 ${R} A ${R} ${R} 0 1 1 0 ${-R} Z`;
    const [x1, y1] = pt(s), [x2, y2] = pt(e);
    return `M 0 0 L ${x1} ${y1} A ${R} ${R} 0 ${span > 0.5 ? 1 : 0} 1 ${x2} ${y2} Z`;
  }
  const radialsD = (list) => list.map((t) => { const [x, y] = pt(t); return `M 0 0 L ${x} ${y}`; }).join(' ');

  class Pie {
    constructor(svg) {
      svg.setAttribute('viewBox', '-100 -100 200 200');
      svg.innerHTML =
        `<circle class="pie-base" r="${R}"></circle><path class="pie-faint"></path><path class="pie-gap"></path>` +
        `<path class="fill-a"></path><path class="fill-b"></path><path class="pie-over"></path>` +
        `<path class="pie-div"></path><circle class="pie-rim" r="${R}"></circle>`;
      [this.faint, this.gap, this.fa, this.fb, this.over, this.div] =
        ['.pie-faint', '.pie-gap', '.fill-a', '.fill-b', '.pie-over', '.pie-div'].map((s) => svg.querySelector(s));
      this.reset();
    }
    reset() { this.st = { faint: 0, gap: null, over: null, a: null, b: null }; this.gap.classList.remove('on'); this.render(); }
    set(patch) { Object.assign(this.st, patch); this.render(); }
    render() {
      const { faint, gap, over, a, b } = this.st;
      this.faint.setAttribute('d', faint ? radialsD(Array.from({ length: faint }, (_, k) => k / faint)) : '');
      this.gap.setAttribute('d', gap ? sectorD(gap[0], gap[1]) : '');
      this.fa.setAttribute('d', a ? sectorD(a.s, a.e) : '');
      this.fb.setAttribute('d', b ? sectorD(b.s, b.e) : '');
      this.over.setAttribute('d', over ? sectorD(over[0], over[1]) : '');
      const lines = [];
      for (const ly of [a, b]) {
        if (!ly || ly.e - ly.s <= 1e-6) continue;
        lines.push(ly.s, ly.e);
        const k0 = Math.ceil((ly.s - ly.o) * ly.den - 1e-6), k1 = Math.floor((ly.e - ly.o) * ly.den + 1e-6);
        for (let k = k0; k <= k1; k++) lines.push(ly.o + k / ly.den);
      }
      this.div.setAttribute('d', radialsD(lines));
    }
  }
  // Uhrzeigersinn: Teile ab 0 gezählt. Gegen den Uhrzeigersinn: Teile ab 1 (oben) rückwärts gezählt.
  const cw = (x, den) => ({ s: 0, e: x, den, o: 0 });
  const ccw = (x, den) => ({ s: 1 - x, e: 1, den, o: 1 });

  /* ---------- Elemente ---------- */
  const el = {
    progress: $('#progress'), expr: $('#expr'), viz: $('#viz'),
    capA: $('#capA'), capB: $('#capB'), capC: $('#capC'),
    verdict: $('#verdict'), actions: $('#actions'), reveal: $('#revealBtn'),
    next: $('#nextBtn'), nextLabel: $('#nextLabel'), taskView: $('#taskView'), summary: $('#summary'),
    pause: $('#pauseToggle'), restart: $('#restartBtn'), fs: $('#fsBtn'),
  };
  const pieA = new Pie($('#pieA')), pieB = new Pie($('#pieB')), pieC = new Pie($('#pieC'));
  const pies = [pieA, pieB, pieC];
  new Pie($('#brandPie')).set({ a: cw(5 / 8, 8), b: ccw(1 / 4, 4), gap: [5 / 8, 3 / 4] });
  $('#brandPie .pie-gap').classList.add('on');

  const state = { tasks: COURSE.slice(), idx: 0, answers: [], phase: 'ask', pending: null };
  const cur = () => state.tasks[state.idx];

  /* ---------- Animation ---------- */
  let runToken = 0;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  function tween(ms, fn, tok) {
    return new Promise((res) => {
      if (reduced.matches) { if (tok === runToken) fn(1); return res(); }
      const t0 = performance.now();
      const step = (now) => {
        if (tok !== runToken) return res();
        const p = Math.min(1, (now - t0) / ms);
        fn(ease(p));
        if (p < 1) requestAnimationFrame(step); else res();
      };
      requestAnimationFrame(step);
    });
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, reduced.matches ? Math.min(ms, 400) : ms));

  async function reveal(t, tok, instant = false) {
    const T = (ms, fn) => (instant ? (fn(1), Promise.resolve()) : tween(ms, fn, tok));
    const W = (ms) => (instant ? Promise.resolve() : wait(ms));
    const alive = () => tok === runToken;
    const A = t.a / t.b, B = t.c / t.d;
    const { L, n, more } = info(t);

    pies.forEach((p) => p.reset());
    el.capC.innerHTML = '';
    pieA.set({ faint: t.b });
    pieB.set({ faint: t.d });

    await T(650, (p) => pieA.set({ a: cw(A * p, t.b) }));
    if (!alive()) return;
    await T(650, (p) => pieB.set({ b: ccw(B * p, t.d) }));
    if (!alive()) return;
    await W(400);
    if (!alive()) return;

    await T(700, (p) => pieC.set({ a: cw(A * p, t.b) }));
    if (!alive()) return;
    pieC.set({ gap: [A, 1] });
    pieC.gap.classList.add('on');
    await W(650);
    if (!alive()) return;

    await T(1150, (p) => {
      const s = 1 - B * p;
      pieC.set({ b: ccw(B * p, t.d), gap: s > A ? [A, s] : null, over: s < A ? [s, A] : null });
    });
    if (!alive()) return;

    if (more) {
      const [rn, rd] = red(n - L, L);
      el.capC.innerHTML = `${F(rn, rd)} zu viel`;
    } else {
      const [mn, md] = red(L - n, L);
      el.capC.innerHTML = `${F(mn, md)} ${mn === 1 ? 'fehlt' : 'fehlen'}`;
    }
  }

  /* ---------- Darstellung ---------- */
  const setActions = () => { el.actions.hidden = el.reveal.hidden && el.next.hidden; };

  function renderProgress() {
    el.progress.innerHTML = [1, 2, 3].map((lv) => {
      const idxs = state.tasks.map((t, i) => (t.level === lv ? i : -1)).filter((i) => i >= 0);
      if (!idxs.length) return '';
      const segs = idxs.map((i) => {
        const ans = state.answers[i];
        const cls = ans ? (ans.correct ? 'good' : 'bad') : (i === state.idx && state.phase !== 'summary' ? 'now' : '');
        return `<span class="seg ${cls}"></span>`;
      }).join('');
      return `<div class="pg" style="flex-grow:${idxs.length}"><span class="pg-label">${LEVEL_NAME[lv]}</span><div class="pg-row">${segs}</div></div>`;
    }).join('');
  }

  function renderTask() {
    runToken++;
    state.phase = 'ask';
    state.pending = null;
    const t = cur();
    el.taskView.hidden = false;
    el.summary.hidden = true;
    el.expr.setAttribute('aria-label', `Aufgabe ${state.idx + 1}: ${t.a}/${t.b} plus ${t.c}/${t.d}, verglichen mit 1`);
    el.expr.innerHTML =
      BigF(t.a, t.b, 'ca') + '<span class="plus" aria-hidden="true">+</span>' + BigF(t.c, t.d, 'cb') +
      '<span class="pickwrap" id="pick">' +
      '<button class="pick" type="button" data-sign="<" aria-label="kleiner als 1">&lt;</button>' +
      '<button class="pick" type="button" data-sign=">" aria-label="größer als 1">&gt;</button>' +
      '</span><span class="one">1</span>';
    el.expr.querySelectorAll('.pick').forEach((b) => b.addEventListener('click', () => choose(b.dataset.sign)));
    el.viz.hidden = true;
    el.verdict.hidden = true;
    el.reveal.hidden = true;
    el.next.hidden = true;
    setActions();
    pies.forEach((p) => p.reset());
    el.capA.innerHTML = F(t.a, t.b, 'ca');
    el.capB.innerHTML = F(t.c, t.d, 'cb');
    el.capC.innerHTML = '';
    renderProgress();
  }

  function showChoice(sign) {
    const wrap = $('#pick');
    if (wrap) wrap.outerHTML = `<span class="slot" id="slot">${sign === '>' ? '&gt;' : '&lt;'}</span>`;
    el.viz.hidden = false;
    el.viz.classList.remove('enter');
    void el.viz.offsetWidth;
    el.viz.classList.add('enter');
  }

  function choose(sign) {
    if (state.phase !== 'ask') return;
    const t = cur();
    const correct = (sign === '>') === info(t).more;
    state.pending = { sign, correct };
    state.phase = 'animating';
    showChoice(sign);
    const tok = ++runToken;
    reveal(t, tok).then(async () => {
      if (tok !== runToken) return;
      if (el.pause.checked) {
        state.phase = 'await';
        el.reveal.hidden = false;
        setActions();
        el.reveal.focus({ preventScroll: true });
      } else {
        await wait(500);
        if (tok !== runToken) return;
        showVerdict();
      }
    });
  }

  function showVerdict() {
    if (!state.pending) return;
    const t = cur();
    const { sign, correct } = state.pending;
    state.answers[state.idx] = { sign, correct };
    state.phase = 'verdict';
    const slot = $('#slot');
    if (slot) slot.classList.add(correct ? 'good' : 'bad');
    el.verdict.className = 'verdict ' + (correct ? 'is-good' : 'is-bad');
    el.verdict.innerHTML =
      `<div class="stamp">${correct ? 'Richtig!' : 'Leider falsch'}</div>` +
      `<p class="v-calc">${calcHTML(t)}</p>`;
    el.verdict.hidden = false;
    el.reveal.hidden = true;
    el.next.hidden = false;
    el.nextLabel.textContent = state.idx === state.tasks.length - 1 ? 'Auswertung' : 'Weiter';
    setActions();
    el.next.focus({ preventScroll: true });
    renderProgress();
    try { el.actions.scrollIntoView({ block: 'nearest', behavior: reduced.matches ? 'auto' : 'smooth' }); } catch (e) {}
  }

  function next() {
    if (state.phase !== 'verdict') return;
    if (state.idx >= state.tasks.length - 1) return showSummary();
    state.idx++;
    renderTask();
    try { el.progress.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }

  const ICON_OK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="richtig"><path d="M4 10.5l4 4 8-9"></path></svg>';
  const ICON_NO = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-label="falsch"><path d="M5 5l10 10M15 5L5 15"></path></svg>';

  function showSummary() {
    runToken++;
    state.phase = 'summary';
    const total = state.tasks.length;
    const right = state.answers.filter((x) => x && x.correct).length;
    const stamp = right === total ? 'Perfekt!' : right >= total * 0.75 ? 'Super!' : right >= total * 0.5 ? 'Gut gemacht' : 'Weiter üben';
    const items = state.tasks.map((t, i) => {
      const ok = state.answers[i] && state.answers[i].correct;
      return `<li class="${ok ? 'good' : 'bad'}"><span>${F(t.a, t.b, 'ca')} + ${F(t.c, t.d, 'cb')} ${info(t).more ? '&gt;' : '&lt;'} 1</span>${ok ? ICON_OK : ICON_NO}</li>`;
    }).join('');
    el.summary.innerHTML =
      `<div class="stamp">${stamp}</div>` +
      `<h2>${right} von ${total} richtig</h2>` +
      `<ol class="recap">${items}</ol>` +
      `<div class="actions">` +
      `<button class="go" type="button" id="againBtn">Nochmal</button>` +
      `<button class="go alt" type="button" id="newBtn">Neue Aufgaben</button>` +
      `</div>`;
    el.taskView.hidden = true;
    el.summary.hidden = false;
    renderProgress();
    $('#againBtn').addEventListener('click', () => startRound(state.tasks));
    $('#newBtn').addEventListener('click', () => startRound(randomRound()));
    $('#againBtn').focus({ preventScroll: true });
  }

  function startRound(tasks) {
    state.tasks = tasks.map((t) => ({ ...t }));
    state.idx = 0;
    state.answers = [];
    renderTask();
  }

  /* ---------- Bedienung ---------- */
  el.reveal.addEventListener('click', () => { if (state.phase === 'await') showVerdict(); });
  el.next.addEventListener('click', next);
  el.restart.addEventListener('click', () => startRound(COURSE));

  try { el.pause.checked = localStorage.getItem('bruch-pause') === '1'; } catch (e) {}
  el.pause.addEventListener('change', () => {
    try { localStorage.setItem('bruch-pause', el.pause.checked ? '1' : '0'); } catch (e) {}
  });

  try {
    if (document.fullscreenEnabled) {
      el.fs.hidden = false;
      el.fs.addEventListener('click', () => {
        const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => {});
      });
      document.addEventListener('fullscreenchange', () => {
        el.fs.textContent = document.fullscreenElement ? 'Vollbild beenden' : 'Vollbild';
      });
    }
  } catch (e) {}

  document.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
    if (state.phase === 'ask') {
      if (e.key === '<' || e.key === 'ArrowLeft') { e.preventDefault(); choose('<'); }
      else if (e.key === '>' || e.key === 'ArrowRight') { e.preventDefault(); choose('>'); }
    } else if (state.phase === 'await' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); showVerdict();
    } else if (state.phase === 'verdict' && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault(); next();
    }
  });

  /* ---------- Start (mit Zustand, falls die Seite aktualisiert wird) ---------- */
  try {
    window.claude?.hot?.snapshot?.(() => ({
      tasks: state.tasks, idx: state.idx, answers: state.answers, summary: state.phase === 'summary',
    }));
  } catch (e) {}

  function start(data) {
    const valid = data && Array.isArray(data.tasks) && data.tasks.length &&
      data.tasks.every((t) => t && [t.a, t.b, t.c, t.d, t.level].every(Number.isInteger));
    if (valid) {
      state.tasks = data.tasks;
      state.idx = Math.max(0, Math.min(data.idx | 0, data.tasks.length - 1));
      state.answers = Array.isArray(data.answers) ? data.answers : [];
      if (data.summary) return showSummary();
    }
    renderTask();
    const ans = state.answers[state.idx];
    if (ans) {
      state.pending = ans;
      showChoice(ans.sign);
      reveal(cur(), runToken, true);
      showVerdict();
    }
  }
  const hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
</body>
</html>
